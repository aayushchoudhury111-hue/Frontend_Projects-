<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>To Do List</title>
</head>
<body>
    <div id="container">
        <h2 id="myH2">To Do List</h2>
        <form>
            <input type="text" id="display" placeholder="Add a new Task">
            <button type="button" id="submit" onclick="addTask()">Add</button>
        </form>
        <div id="list">
            <ul id="task">
            </ul>
        </div>
    </div>
    <script src="index.js"></script>
</body>
</html>
